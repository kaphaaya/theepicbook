trigger:
  branches:
    include:
      - main

variables:
  - group: epicbook-secrets   # provides DB_ADMIN_PASSWORD, DB_ADMIN_USERNAME
  - name: ansibleDirectory
    value: ansible
  - name: frontendSG
    value: sg-09352e5675dc28ccc
  - name: backendSG
    value: sg-0efee5a13524184ba

stages:

  # ── Stage 1: Validate ──────────────────────────────────────────────────────
  # Install Ansible and required collections, then validate inventory parsing
  # and playbook syntax.  No SSH connection required.
  - stage: Validate
    displayName: 'Validate'
    jobs:
      - job: ValidateJob
        displayName: 'Inventory + syntax check'
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: pip install --quiet ansible
            displayName: 'Install Ansible'

          - script: |
              ansible-galaxy collection install \
                -r $(ansibleDirectory)/requirements.yml \
                --force
            displayName: 'Install Ansible collections'

          - script: |
              ansible-inventory \
                -i $(ansibleDirectory)/inventory/hosts.ini \
                --list
            displayName: 'Validate inventory'

          # Pass a dummy vault_db_password so Ansible can render templates
          # during the syntax check without a real secret.
          - script: |
              ansible-playbook $(ansibleDirectory)/site.yml \
                -i $(ansibleDirectory)/inventory/hosts.ini \
                --syntax-check \
                --extra-vars "vault_db_password=syntax_check_placeholder"
            displayName: 'Ansible syntax check'

  # ── Stage 2: Connectivity ─────────────────────────────────────────────────
  # Temporarily authorize the agent IP in both EC2 security groups, verify
  # SSH reachability via Ansible ping, then revoke the rule.
  - stage: Connectivity
    displayName: 'Connectivity'
    dependsOn: Validate
    jobs:
      - job: ConnectivityJob
        displayName: 'SSH connectivity check'
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - script: pip install --quiet ansible
            displayName: 'Install Ansible'

          - task: DownloadSecureFile@1
            name: sshKey
            displayName: 'Download SSH private key'
            inputs:
              secureFile: 'epicbook-keypair.pem'

          - script: chmod 600 $(sshKey.secureFilePath)
            displayName: 'Set SSH key permissions'

          - script: |
              AGENT_IP=$(curl -sf https://checkip.amazonaws.com)
              echo "Agent IP: $AGENT_IP"
              echo "##vso[task.setvariable variable=AGENT_IP]$AGENT_IP"
              aws ec2 authorize-security-group-ingress \
                --group-id $(frontendSG) \
                --protocol tcp --port 22 --cidr "$AGENT_IP/32"
              aws ec2 authorize-security-group-ingress \
                --group-id $(backendSG) \
                --protocol tcp --port 22 --cidr "$AGENT_IP/32"
            displayName: 'Authorize agent IP in security groups'
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

          - script: |
              ansible all \
                -i $(ansibleDirectory)/inventory/hosts.ini \
                --private-key "$(sshKey.secureFilePath)" \
                -m ansible.builtin.ping
            displayName: 'Ping all hosts'

          - script: |
              aws ec2 revoke-security-group-ingress \
                --group-id $(frontendSG) \
                --protocol tcp --port 22 --cidr "$(AGENT_IP)/32"
              aws ec2 revoke-security-group-ingress \
                --group-id $(backendSG) \
                --protocol tcp --port 22 --cidr "$(AGENT_IP)/32"
            displayName: 'Revoke agent IP from security groups'
            condition: always()
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

  # ── Stage 3: Deploy ────────────────────────────────────────────────────────
  # Run the full site.yml playbook.  Uses a deployment job so an Azure DevOps
  # environment approval gate can be added when needed.
  # DB_ADMIN_PASSWORD is injected as vault_db_password via --extra-vars;
  # Azure DevOps masks it in logs because it is a secret variable.
  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Connectivity
    jobs:
      - deployment: DeployJob
        displayName: 'Run Ansible playbook'
        pool:
          vmImage: ubuntu-latest
        environment: epicbook-app-approval
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: pip install --quiet ansible
                  displayName: 'Install Ansible'

                - script: |
                    ansible-galaxy collection install \
                      -r $(ansibleDirectory)/requirements.yml \
                      --force
                  displayName: 'Install Ansible collections'

                - task: DownloadSecureFile@1
                  name: sshKey
                  displayName: 'Download SSH private key'
                  inputs:
                    secureFile: 'epicbook-keypair.pem'

                - script: chmod 600 $(sshKey.secureFilePath)
                  displayName: 'Set SSH key permissions'

                - script: |
                    AGENT_IP=$(curl -sf https://checkip.amazonaws.com)
                    echo "Agent IP: $AGENT_IP"
                    echo "##vso[task.setvariable variable=AGENT_IP]$AGENT_IP"
                    aws ec2 authorize-security-group-ingress \
                      --group-id $(frontendSG) \
                      --protocol tcp --port 22 --cidr "$AGENT_IP/32"
                    aws ec2 authorize-security-group-ingress \
                      --group-id $(backendSG) \
                      --protocol tcp --port 22 --cidr "$AGENT_IP/32"
                  displayName: 'Authorize agent IP in security groups'
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

                - script: |
                    ansible-playbook $(ansibleDirectory)/site.yml \
                      -i $(ansibleDirectory)/inventory/hosts.ini \
                      --private-key "$(sshKey.secureFilePath)" \
                      --extra-vars "vault_db_password=$(DB_ADMIN_PASSWORD)"
                  displayName: 'Deploy EpicBook'

                - script: |
                    aws ec2 revoke-security-group-ingress \
                      --group-id $(frontendSG) \
                      --protocol tcp --port 22 --cidr "$(AGENT_IP)/32"
                    aws ec2 revoke-security-group-ingress \
                      --group-id $(backendSG) \
                      --protocol tcp --port 22 --cidr "$(AGENT_IP)/32"
                  displayName: 'Revoke agent IP from security groups'
                  condition: always()
                  env:
                    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                    AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

  # ── Stage 4: Verify ────────────────────────────────────────────────────────
  # Simple HTTP smoke test: confirm the frontend returns an HTML page that
  # contains the application title.
  - stage: Verify
    displayName: 'Verify'
    dependsOn: Deploy
    jobs:
      - job: VerifyJob
        displayName: 'HTTP smoke test'
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              echo "Waiting for application to be fully up..."
              sleep 10
              echo "Testing EpicBook at http://13.49.23.121/"
              curl -fsSL --max-time 30 http://13.49.23.121/ \
                | grep -i -E "epicbook|EpicBook|book" > /dev/null
              echo "Smoke test passed — EpicBook frontend is responding."
            displayName: 'Verify application is accessible'
